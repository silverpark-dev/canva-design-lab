<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CANVA DESIGN LAB | 우리 반 포트폴리오</title>

<style>
:root{
  --bg:#f8f5ee;
  --paper:#fffefa;
  --ink:#153e5d;
  --muted:#817c74;
  --line:#e5dfd4;
  --mint:#43b6a1;
  --coral:#f27a68;
  --yellow:#efbe54;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;
}

main{
  width:min(1160px,calc(100% - 28px));
  margin:24px auto 60px;
}

.hero{
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  background:white;
}

.hero img{
  display:block;
  width:100%;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin:30px 2px 16px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}

h2{
  margin:0 0 6px;
  font-size:26px;
}

.head p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.search{
  width:230px;
  border:1px solid var(--line);
  background:white;
  border-radius:999px;
  padding:10px 15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.card{
  min-height:140px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:11px;
  padding:15px;
  display:flex;
  flex-direction:column;
  cursor:pointer;
  transition:.15s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 24px rgba(55,48,38,.07);
}

.top{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:#aaa;
  letter-spacing:.08em;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--mint);
}

.card:nth-child(3n+2) .dot{
  background:var(--coral);
}

.card:nth-child(3n) .dot{
  background:var(--yellow);
}

h3{
  font-size:15px;
  margin:30px 0 5px;
}

.count{
  font-size:10px;
  color:#999;
  margin-top:auto;
}

.modal{
  position:fixed;
  inset:0;
  background:#0006;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:10;
}

.modal.on{
  display:flex;
}

.panel{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--bg);
  border-radius:17px;
  padding:22px;
}

.panelhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.panelhead h2{
  margin:0;
}

.close{
  border:0;
  background:white;
  border-radius:50%;
  width:35px;
  height:35px;
  font-size:18px;
  cursor:pointer;
}

.lessons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.lesson{
  background:white;
  border:1px solid var(--line);
  border-radius:11px;
  padding:14px;
}

.lesson b{
  font-size:13px;
}

.row{
  display:flex;
  gap:7px;
  margin-top:11px;
}

.row input{
  min-width:0;
  flex:1;
  border:1px solid var(--line);
  border-radius:7px;
  padding:9px;
  font-size:11px;
}

.row button,
.open{
  border:0;
  border-radius:7px;
  padding:9px 10px;
  font-size:10px;
  cursor:pointer;
}

.save{
  background:var(--ink);
  color:white;
}

.save:disabled{
  opacity:.6;
  cursor:wait;
}

.open{
  display:inline-block;
  background:var(--mint);
  color:white;
  text-decoration:none;
  margin-top:8px;
}

.status{
  font-size:11px;
  color:#777;
  margin:10px 2px 0;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:600px){

  main{
    width:calc(100% - 18px);
    margin-top:9px;
  }

  .hero{
    border-radius:9px;
  }

  .head{
    display:block;
  }

  .search{
    width:100%;
    margin-top:13px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .lessons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<main>

  <div class="hero">
    <img
      src="title.png"
      alt="CANVA DESIGN LAB 나만의 포트폴리오 10회"
    >
  </div>

  <div class="head">

    <div>
      <h2>우리 반 친구들</h2>
      <p>
        친구를 선택하고 차시별 Canva 작품 링크를 등록해요.
      </p>
    </div>

    <input
      id="search"
      class="search"
      placeholder="이름으로 찾아보기"
    >

  </div>

  <div class="grid" id="grid"></div>

  <div class="status" id="status">
    공용 저장소 연결 확인 중...
  </div>

</main>


<div class="modal" id="modal">

  <div class="panel">

    <div class="panelhead">

      <h2 id="studentTitle"></h2>

      <button
        class="close"
        id="closeButton"
        type="button"
      >
        ×
      </button>

    </div>

    <div
      class="lessons"
      id="lessons"
    ></div>

  </div>

</div>


<script>

const API = "/api/portfolio";

let all = {};
let current = 1;


const lessonNames = [
  "1차시",
  "2차시",
  "3차시",
  "4차시",
  "5차시",
  "6차시",
  "7차시",
  "8차시",
  "9차시",
  "10차시"
];


/* =========================
   HTML 특수문자 처리
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   학생 카드 그리기
========================= */

function draw(q=""){

  const grid =
    document.getElementById("grid");

  grid.innerHTML = "";

  for(let i=1;i<=24;i++){

    const name =
      `${i}번 친구`;

    if(!name.includes(q)){
      continue;
    }

    const studentData =
      all[String(i)] || {};

    const saved =
      Object.values(studentData)
        .filter(Boolean)
        .length;

    const card =
      document.createElement("div");

    card.className = "card";

    card.addEventListener(
      "click",
      () => openStudent(i)
    );

    card.innerHTML = `
      <div class="top">

        <span>
          STUDENT ${String(i).padStart(2,"0")}
        </span>

        <span class="dot"></span>

      </div>

      <h3>${name}</h3>

      <div class="count">
        ${saved}/10 작품 등록됨 →
      </div>
    `;

    grid.appendChild(card);
  }
}


/* =========================
   공용 저장소 불러오기
========================= */

async function load(){

  const status =
    document.getElementById("status");

  try{

    const response =
      await fetch(
        API,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    all =
      data && typeof data === "object"
        ? data
        : {};

    status.textContent =
      "✓ 온라인 공용 저장 연결됨";

    draw();

  }
  catch(error){

    console.error(
      "저장소 연결 오류:",
      error
    );

    status.textContent =
      "저장소 연결 실패 — Netlify API 설정을 확인해주세요.";

    draw();
  }
}


/* =========================
   학생 포트폴리오 열기
========================= */

function openStudent(i){

  current = i;

  document
    .getElementById("studentTitle")
    .textContent =
      `${i}번 친구의 포트폴리오`;

  const box =
    document.getElementById("lessons");

  box.innerHTML = "";

  const data =
    all[String(i)] || {};


  lessonNames.forEach(
    (name,index) => {

      const lesson =
        String(index + 1);

      const url =
        data[lesson] || "";

      const item =
        document.createElement("div");

      item.className = "lesson";


      const title =
        document.createElement("b");

      title.textContent = name;


      const row =
        document.createElement("div");

      row.className = "row";


      const input =
        document.createElement("input");

      input.id =
        `u-${lesson}`;

      input.type = "url";

      input.placeholder =
        "Canva 작품 링크 붙여넣기";

      input.value = url;


      const button =
        document.createElement("button");

      button.className = "save";

      button.type = "button";

      button.textContent = "저장";

      button.addEventListener(
        "click",
        () => saveLink(
          lesson,
          button
        )
      );


      row.appendChild(input);
      row.appendChild(button);

      item.appendChild(title);
      item.appendChild(row);


      if(url){

        const link =
          document.createElement("a");

        link.className = "open";

        link.href = url;

        link.target = "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          "작품 보기 ↗";

        item.appendChild(link);
      }


      box.appendChild(item);
    }
  );


  document
    .getElementById("modal")
    .classList
    .add("on");
}


/* =========================
   창 닫기
========================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList
    .remove("on");

  const search =
    document
      .getElementById("search")
      .value
      .trim();

  draw(search);
}


/* =========================
   링크 저장
========================= */

async function saveLink(
  lesson,
  button
){

  const input =
    document.getElementById(
      "u-" + lesson
    );

  const url =
    input.value.trim();


  /*
    URL 검사
    정규식 오류 수정 완료
  */

  if(
    url &&
    !/^https?:\/\//i.test(url)
  ){

    alert(
      "http:// 또는 https://로 시작하는 링크를 넣어주세요."
    );

    return;
  }


  button.disabled = true;

  const oldText =
    button.textContent;

  button.textContent =
    "저장 중";


  try{

    const response =
      await fetch(
        API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            student:current,
            lesson:Number(lesson),
            url:url
          })
        }
      );


    let result;

    try{

      result =
        await response.json();

    }
    catch{

      result = {};
    }


    if(!response.ok){

      throw new Error(
        result.error ||
        `저장 실패 (HTTP ${response.status})`
      );
    }


    /*
      API가 전체 데이터를 반환하는 구조
    */

    if(result.data){

      all = result.data;

    }
    else{

      if(!all[String(current)]){

        all[String(current)] = {};
      }

      all[String(current)][lesson] =
        url;
    }


    openStudent(current);

  }
  catch(error){

    console.error(
      "링크 저장 오류:",
      error
    );

    alert(
      "저장하지 못했습니다.\n\n" +
      error.message
    );

  }
  finally{

    button.disabled = false;

    button.textContent =
      oldText;
  }
}


/* =========================
   검색
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    function(event){

      draw(
        event.target
          .value
          .trim()
      );
    }
  );


/* =========================
   닫기 버튼
========================= */

document
  .getElementById("closeButton")
  .addEventListener(
    "click",
    closeModal
  );


/* =========================
   모달 바깥 클릭
========================= */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target.id === "modal"
      ){
        closeModal();
      }
    }
  );


/* =========================
   시작
========================= */

draw();
load();

</script>

</body>
</html>
