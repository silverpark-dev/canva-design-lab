<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CANVA DESIGN LAB | 우리 반 포트폴리오</title>
<style>
:root{--bg:#f8f5ee;--paper:#fffefa;--ink:#153e5d;--muted:#817c74;--line:#e5dfd4;--mint:#43b6a1;--coral:#f27a68;--yellow:#efbe54}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
main{width:min(1160px,calc(100% - 28px));margin:24px auto 60px}.hero{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white}.hero img{display:block;width:100%}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:30px 2px 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
h2{margin:0 0 6px;font-size:26px}.head p{margin:0;color:var(--muted);font-size:13px}.search{width:230px;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 15px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.card{min-height:140px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:15px;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 9px 24px rgba(55,48,38,.07)}.top{display:flex;justify-content:space-between;font-size:10px;color:#aaa;letter-spacing:.08em}.dot{width:9px;height:9px;border-radius:50%;background:var(--mint)}
.card:nth-child(3n+2) .dot{background:var(--coral)}.card:nth-child(3n) .dot{background:var(--yellow)}h3{font-size:15px;margin:30px 0 5px}.count{font-size:10px;color:#999;margin-top:auto}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal.on{display:flex}.panel{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:17px;padding:22px}
.panelhead{display:flex;justify-content:space-between;align-items:center}.panelhead h2{margin:0}.close{border:0;background:white;border-radius:50%;width:35px;height:35px;font-size:18px;cursor:pointer}
.lessons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.lesson{background:white;border:1px solid var(--line);border-radius:11px;padding:14px}.lesson b{font-size:13px}.row{display:flex;gap:7px;margin-top:11px}
.row input{min-width:0;flex:1;border:1px solid var(--line);border-radius:7px;padding:9px;font-size:11px}.row button,.open{border:0;border-radius:7px;padding:9px 10px;font-size:10px;cursor:pointer}.save{background:var(--ink);color:white}.open{display:inline-block;background:var(--mint);color:white;text-decoration:none;margin-top:8px}.status{font-size:11px;color:#777;margin:10px 2px 0}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){main{width:calc(100% - 18px);margin-top:9px}.hero{border-radius:9px}.head{display:block}.search{width:100%;margin-top:13px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.lessons{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="hero"><img src="title.png" alt="CANVA DESIGN LAB 나만의 포트폴리오 10회"></div>
<div class="head"><div><h2>우리 반 친구들</h2><p>친구를 선택하고 차시별 Canva 작품 링크를 등록해요.</p></div><input id="search" class="search" placeholder="이름으로 찾아보기"></div>
<div class="grid" id="grid"></div><div class="status" id="status">공용 저장소 연결 확인 중...</div>
</main>
<div class="modal" id="modal"><div class="panel"><div class="panelhead"><h2 id="studentTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div class="lessons" id="lessons"></div></div></div>
<script>
const API="/api/portfolio"; let all={}, current=1;
const lessonNames=["1차시","2차시","3차시","4차시","5차시","6차시","7차시","8차시","9차시","10차시"];
function draw(q=""){const g=document.getElementById("grid");g.innerHTML="";for(let i=1;i<=24;i++){let name=`${i}번 친구`;if(!name.includes(q))continue;let saved=Object.values(all[String(i)]||{}).filter(Boolean).length;let d=document.createElement("div");d.className="card";d.onclick=()=>openStudent(i);d.innerHTML=`<div class="top"><span>STUDENT ${String(i).padStart(2,"0")}</span><span class="dot"></span></div><h3>${name}</h3><div class="count">${saved}/10 작품 등록됨 →</div>`;g.appendChild(d)}}
async function load(){try{let r=await fetch(API,{cache:"no-store"});if(!r.ok)throw Error();all=await r.json();document.getElementById("status").textContent="✓ 온라인 공용 저장 연결됨";draw()}catch(e){document.getElementById("status").textContent="저장소 연결 실패 — Netlify에서 배포한 뒤 다시 확인하세요.";draw()}}
function openStudent(i){current=i;document.getElementById("studentTitle").textContent=`${i}번 친구의 포트폴리오`;let box=document.getElementById("lessons");box.innerHTML="";let data=all[String(i)]||{};lessonNames.forEach((n,idx)=>{let k=String(idx+1),v=data[k]||"";let d=document.createElement("div");d.className="lesson";d.innerHTML=`<b>${n}</b><div class="row"><input id="u-${k}" placeholder="Canva 작품 링크 붙여넣기" value="${escapeHtml(v)}"><button class="save" onclick="saveLink('${k}')">저장</button></div>${v?`<a class="open" href="${escapeHtml(v)}" target="_blank" rel="noopener">작품 보기 ↗</a>`:""}`;box.appendChild(d)});document.getElementById("modal").classList.add("on")}
function closeModal(){document.getElementById("modal").classList.remove("on");draw(document.getElementById("search").value.trim())}
async function saveLink(lesson){let url=document.getElementById("u-"+lesson).value.trim();if(url && !/^https?:\\/\\//i.test(url)){alert("http:// 또는 https://로 시작하는 링크를 넣어주세요.");return}let btn=event.currentTarget;btn.disabled=true;btn.textContent="저장 중";try{let r=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({student:current,lesson:Number(lesson),url})});let j=await r.json();if(!r.ok)throw Error(j.error||"저장 실패");all=j.data;openStudent(current)}catch(e){alert(e.message)}finally{btn.disabled=false}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
document.getElementById("search").addEventListener("input",e=>draw(e.target.value.trim()));document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});load();
</script></body></html>
