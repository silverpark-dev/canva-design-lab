<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CANVA DESIGN LAB | 우리 반 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="hero">
    <img src="title.png" alt="CANVA DESIGN LAB 나만의 포트폴리오 10회">
  </div>

  <div class="head">
    <div>
      <h2>우리 반 친구들</h2>
      <p>친구를 선택하고 차시별 Canva 작품 링크를 등록해요.</p>
    </div>
    <input id="search" class="search" placeholder="이름으로 찾아보기">
  </div>

  <div class="grid" id="grid"></div>
  <div class="status" id="status">공용 저장소 연결 확인 중...</div>
</main>

<div class="modal" id="modal">
  <div class="panel">
    <div class="panelhead">
      <h2 id="studentTitle"></h2>
      <button class="close" id="closeButton" type="button">×</button>
    </div>
    <div class="lessons" id="lessons"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
